apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: findr-api
  namespace: findr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - api.findr.example.com
      secretName: findr-api-tls
  rules:
    - host: api.findr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: findr-api
                port:
                  number: 80
