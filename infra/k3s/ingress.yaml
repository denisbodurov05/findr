apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: findr
  namespace: findr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: findr.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: findr-api
                port:
                  number: 80
