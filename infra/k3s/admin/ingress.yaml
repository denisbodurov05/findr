apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: findr-admin
  namespace: findr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - admin.findr.example.com
      secretName: findr-admin-tls
  rules:
    - host: admin.findr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: findr-admin
                port:
                  number: 80
